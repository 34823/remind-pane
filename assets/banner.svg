<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1419"/><stop offset="1" stop-color="#1b2433"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <text x="80" y="170" font-size="84" font-weight="700" fill="#ffffff">remind-pane</text>
  <text x="80" y="228" font-size="30" fill="#f2b84b">Reminders in a Claude Code pane</text>
  <text x="80" y="300" font-size="22" fill="#9fb1c5">Tick them off, delete them, add one in a line.</text>
  <text x="80" y="336" font-size="22" fill="#9fb1c5">A small CLI in the box, standard library only.</text>
  <text x="80" y="372" font-size="22" fill="#9fb1c5">Telegram delivery is optional.</text>
  <g font-size="20" fill="#0f1419">
    <rect x="80" y="440" width="170" height="44" rx="22" fill="#f2b84b"/><text x="108" y="469">Claude Code</text>
    <rect x="266" y="440" width="150" height="44" rx="22" fill="#f2b84b"/><text x="294" y="469">Reminders</text>
    <rect x="432" y="440" width="120" height="44" rx="22" fill="#f2b84b"/><text x="460" y="469">MIT</text>
  </g>
  <text x="80" y="580" font-size="20" fill="#5d7088">github.com/34823/remind-pane</text>
  <!-- terminal mock -->
  <g>
    <rect x="700" y="90" width="500" height="460" rx="14" fill="#0b0f14" stroke="#2b3a4f" stroke-width="2"/>
    <circle cx="728" cy="116" r="7" fill="#ff5f56"/><circle cx="752" cy="116" r="7" fill="#ffbd2e"/><circle cx="776" cy="116" r="7" fill="#27c93f"/>
    <line x1="700" y1="140" x2="1200" y2="140" stroke="#2b3a4f" stroke-width="2"/>
    <g font-size="18">
      <text x="724" y="176" font-weight="700" fill="#f2b84b">Reminders</text><text x="1060" y="176" fill="#9fb1c5">2 left</text>
      <text x="724" y="204" fill="#9ece6a">█████</text><text x="809" y="204" fill="#2b3a4f">███████████</text><text x="1010" y="204" fill="#9fb1c5" font-size="16">1/3</text>
      <rect x="724" y="228" width="452" height="36" rx="6" fill="none" stroke="#2b3a4f"/>
      <text x="740" y="252" fill="#f2b84b">+</text><text x="772" y="252" fill="#5d7088">new reminder, Enter</text>
      <line x1="724" y1="290" x2="1176" y2="290" stroke="#2b3a4f"/>
      <text x="724" y="326" font-weight="700" fill="#f2b84b">[ ]</text><text x="780" y="326" fill="#e6edf3">Call Anna</text><text x="1150" y="326" fill="#5d7088">✕</text>
      <text x="780" y="350" fill="#5d7088" font-size="15">2026-10-10 18:00 CEST</text>
      <text x="724" y="394" font-weight="700" fill="#f2b84b">[ ]</text><text x="780" y="394" fill="#e6edf3">Send the invoice</text><text x="1150" y="394" fill="#5d7088">✕</text>
      <text x="780" y="418" fill="#5d7088" font-size="15">2026-10-11 09:00 CEST ↻ weekly</text>
      <text x="724" y="462" font-weight="700" fill="#9ece6a">[✔]</text><text x="780" y="462" fill="#5d7088" text-decoration="line-through">Buy milk</text><text x="1150" y="462" fill="#5d7088">✕</text>
    </g>
  </g>
</svg>
